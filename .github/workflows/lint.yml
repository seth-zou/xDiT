name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Run ruff
        run: ruff check --output-format=github .
  vulture:
    # Dead-code detection. vulture finds unused functions/methods/properties/
    # classes/attributes that ruff's F401/F841 (imports/locals only) cannot
    # detect across modules. The wrapper/register architecture and optional-dep
    # availability checks produce false positives that are documented in
    # vulture_whitelist.py; the whitelist is passed so intentional patterns do
    # not trigger false failures.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install vulture
        run: pip install vulture==2.16
      - name: Run vulture
        run: vulture --min-confidence 80 xfuser entrypoints vulture_whitelist.py


